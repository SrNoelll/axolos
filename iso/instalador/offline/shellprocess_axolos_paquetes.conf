# AxolOS · instalación sin conexión, dentro del sistema nuevo y antes de configurar el inicio de sesión:
# llavero de pacman (en el live es temporal) y los paquetes que el live no lleva y AxolOS necesita
# (SDDM para la pantalla de inicio de sesión, Limine para el arranque). Van en la ISO como archivos.
---
dontChroot: false
timeout: 900
script:
    - "pacman-key --init"
    - "pacman-key --populate"
    - "pacman -U --noconfirm --needed /var/cache/axolos-offline/*.pkg.tar.zst"
    - "-rm -rf /var/cache/axolos-offline"
i18n:
    name: "Installing the AxolOS login and boot screens"
    name[es]: "Instalando el inicio de sesión y el arranque de AxolOS"
