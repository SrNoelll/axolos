# AxolOS · instalación sin conexión, justo después de copiar el sistema live al disco (fuera del chroot).
# Lo que el modo con conexión hace por su cuenta y este no: repositorios (con [axolos]), pantalla de
# arranque AxolOS y quitar lo que solo sirve en el live.
---
dontChroot: true
timeout: 600
script:
    - "cp /etc/pacman-more.conf ${ROOT}/etc/pacman.conf"
    - "/etc/calamares/scripts/detect-architecture ${ROOT}/etc/pacman.conf"
    - "mkdir -p ${ROOT}/var/cache/axolos-offline"
    - "cp -r /usr/share/axolos/instalador/offline/paquetes/. ${ROOT}/var/cache/axolos-offline/"
    - "sh /usr/share/axolos/instalador/offline/limpiar-live.sh ${ROOT}"
i18n:
    name: "Preparing AxolOS"
    name[es]: "Preparando AxolOS"
