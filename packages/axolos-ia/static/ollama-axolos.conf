# AxolOS · ajustes del servicio de IA local (Ollama)
[Service]
# Atención más eficiente y caché de contexto a 8 bits: ~mitad de VRAM para el contexto, misma calidad
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# (Sin cambiar OLLAMA_KEEP_ALIVE: a los 5 min sin preguntas el modelo sale de la gráfica)
# Solo escucha en este equipo (nada accesible desde la red)
Environment="OLLAMA_HOST=127.0.0.1:11434"
