<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- AxolOS · tipografías de la marca con respaldo libre.
     El tema usa SF Pro (interfaz) y New York (títulos) de Apple. Su licencia no permite
     redistribuirlas, así que AxolOS no las trae: si no están instaladas (paquete apple-fonts
     del AUR), se usan Inter y Source Serif 4, que son libres y muy parecidas. -->
<fontconfig>
  <alias binding="same">
    <family>SF Pro Display</family>
    <accept><family>Inter</family></accept>
  </alias>
  <alias binding="same">
    <family>SF Pro Text</family>
    <accept><family>Inter</family></accept>
  </alias>
  <alias binding="same">
    <family>SF Pro</family>
    <accept><family>Inter</family></accept>
  </alias>
  <alias binding="same">
    <family>New York</family>
    <accept><family>Source Serif 4</family></accept>
  </alias>
  <alias binding="same">
    <family>New York Medium</family>
    <accept><family>Source Serif 4</family></accept>
  </alias>
  <alias binding="same">
    <family>New York Small</family>
    <accept><family>Source Serif 4</family></accept>
  </alias>
  <alias binding="same">
    <family>New York Extra Large</family>
    <accept><family>Source Serif 4 Display</family><family>Source Serif 4</family></accept>
  </alias>
</fontconfig>
